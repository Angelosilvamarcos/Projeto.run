<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="ATLETAOS — plataforma de treino e performance" />
    <title>ATLETAOS — Treino & Performance</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      body { overflow-x: hidden; background: #0a0c10; }
      button, input, select, textarea { font: inherit; }

      /* Layout responsivo: no desktop o conteúdo usa a largura disponível;
         no celular mantém margens confortáveis. O onboarding continua compacto. */
      #root div[style*="max-width: 600px"] {
        width: min(1200px, calc(100vw - 32px)) !important;
        max-width: 1200px !important;
      }
      #root > div[style*="max-width: 600px"] {
        width: 100% !important;
        max-width: 600px !important;
      }
      #root div[style*="max-width: 720px"] {
        width: min(1200px, calc(100vw - 32px)) !important;
        max-width: 1200px !important;
      }

      @media (max-width: 700px) {
        #root div[style*="max-width: 600px"],
        #root div[style*="max-width: 720px"] {
          width: 100% !important;
          max-width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
